name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check source snapshot
        run: bash scripts/check-release.sh --tracked
      - name: Install locked dependencies
        run: |
          go mod download all
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: Build and test frontend
        run: |
          npm --prefix web test
          npm --prefix web run build
          node --test tests/test_*.mjs
      - name: Test Go and compatibility code
        run: |
          go test -race ./internal/... ./cmd/...
          python3 -m unittest discover -s tests
      - name: Build native binary
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p build
          go build -trimpath -o build/panel ./cmd/panel
          python3 scripts/smoke_binary.py build/panel
      - name: Package platform archive
        run: python3 scripts/package_release.py --platform '${{ matrix.platform }}' --binary build/panel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
